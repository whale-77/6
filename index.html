<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日语综合教程 第六册 · 单词表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f6f4f0;--card:#fff;--border:#e0dbd2;--accent:#5b7e6a;--accent-light:#e8f0eb;--accent-dark:#3d5c4a;--text:#2c2c2c;--text-light:#888;--kana:#8b5e3c;--kanji:#2c2c2c;--meaning:#555;--fav:#d4a853;--hid:#eae7e1;--danger:#c0392b}
body{font-family:'Noto Sans SC','Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5;-webkit-user-select:none;user-select:none}
.container{max-width:900px;margin:0 auto;padding:24px 14px 80px}
header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--accent)}
header h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:3px}
header .sub{font-size:12px;color:var(--text-light);margin-top:6px}
.test-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.test-label{font-size:12px;color:var(--text-light);white-space:nowrap}
.col-tog{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);transition:.15s;user-select:none}
.col-tog:hover{border-color:var(--accent)}.col-tog.off{background:var(--accent);color:#fff;border-color:var(--accent)}
.reveal-btn{margin-left:auto;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text-light)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:5px 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text-light);cursor:pointer;font-family:inherit;transition:.15s}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.fav-tab{border-color:var(--fav);color:var(--fav)}.tab.fav-tab.active{background:var(--fav);color:#fff}
.grid{display:flex;flex-wrap:wrap;gap:10px}
.word-card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 12px 8px;position:relative;min-width:0;flex:0 0 auto;width:calc(20% - 8px);transition:box-shadow .15s,transform .15s}
.word-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.word-card.pressing{transform:scale(0.96);box-shadow:0 0 0 2px var(--accent)}
.word-card .row{text-align:center}
.row-kana{font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--kana);font-weight:500;margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-kanji{font-family:'Noto Sans JP',sans-serif;font-size:15px;color:var(--kanji);font-weight:700;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-kanji.empty{color:#ccc;font-weight:400}
.row-meaning{font-size:11.5px;color:var(--meaning);line-height:1.4;white-space:normal;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cell-hide{position:relative;cursor:pointer}.cell-hide .inner{visibility:hidden}
.cell-hide::after{content:"···";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:var(--hid);color:#bbb;font-size:12px;border-radius:3px}
.cell-hide.show .inner{visibility:visible}.cell-hide.show::after{display:none}
.fav-btn{position:absolute;top:4px;right:6px;background:none;border:none;font-size:14px;cursor:pointer;opacity:.3;transition:.15s;padding:2px}
.fav-btn:hover{opacity:.7}.fav-btn.on{opacity:1;color:var(--fav)}
.add-card{background:var(--accent-light);border:2px dashed var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:80px;flex:0 0 auto;width:calc(20% - 8px);font-size:24px;color:var(--accent);opacity:.6;transition:.15s}
.add-card:hover{opacity:1}
.word-card.deleted{opacity:.5;border-style:dashed}
.word-card.deleted .row-kana{color:#aaa}
.word-card.deleted .row-kanji{color:#aaa}
.word-card.deleted .row-meaning{color:#bbb}
/* Modal */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:100;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal-box{background:#fff;border-radius:14px;padding:24px 20px;width:90%;max-width:360px;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.modal-box h3{font-size:16px;margin-bottom:16px;color:var(--accent);text-align:center}
.modal-box input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;margin-bottom:10px;font-family:inherit;outline:none}
.modal-box input:focus{border-color:var(--accent)}
.modal-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.modal-actions button{flex:1;padding:10px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit}
.btn-save{background:var(--accent);color:#fff}
.btn-del{background:var(--danger);color:#fff}
.btn-cancel{background:#eee;color:#666}
.btn-move{background:var(--accent-light);color:var(--accent);border:1px solid var(--accent)!important;flex:0 0 auto!important;padding:10px 16px!important}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 24px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.empty-msg{text-align:center;padding:40px;color:var(--text-light);font-size:14px}
.reset-row{text-align:center;margin-top:20px}
.reset-btn{background:none;border:none;color:#ccc;font-size:12px;cursor:pointer;font-family:inherit}
.reset-btn:hover{color:var(--danger)}
.tip{text-align:center;font-size:11px;color:var(--text-light);margin-bottom:14px}
@media(max-width:700px){.word-card,.add-card{width:calc(33.33% - 7px)}}
@media(max-width:480px){.word-card,.add-card{width:calc(50% - 5px)}}
</style>
</head>
<body>
<div class="container">
<div class="toast" id="toast"></div>
<header>
<h1>日语综合教程 第六册</h1>
<p class="sub" id="counter"></p>
</header>
<div class="test-bar">
<span class="test-label">自测隐藏：</span>
<button class="col-tog" id="togKana"><span class="eye">👁</span> 读音</button>
<button class="col-tog" id="togKanji"><span class="eye">👁</span> 汉字</button>
<button class="col-tog" id="togMeaning"><span class="eye">👁</span> 释义</button>
<button class="reveal-btn" id="revealAll">全部显示</button>
</div>
<p class="tip">💡 长按单词卡片可编辑、删除、移动</p>
<div class="tabs" id="tabs"></div>
<div class="grid" id="grid"></div>
<div class="empty-msg" id="emptyMsg" style="display:none">没有找到单词</div>
<div class="reset-row"><button class="reset-btn" id="resetBtn">重置为初始数据</button></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modal">
<div class="modal-box">
<h3 id="modalTitle">编辑单词</h3>
<input id="mKana" placeholder="假名读音 *">
<input id="mKanji" placeholder="汉字（可空）">
<input id="mMeaning" placeholder="中文释义">
<div class="modal-actions">
<button class="btn-move" id="btnUp">↑</button>
<button class="btn-move" id="btnDown">↓</button>
<button class="btn-del" id="btnDel" style="display:none">删除</button>
<button class="btn-cancel" id="btnCancel">取消</button>
<button class="btn-save" id="btnSave">保存</button>
</div>
</div>
</div>

function render(){
  var ws=getFiltered(),ls=getLessons();
  document.getElementById("counter").textContent="共 "+words.length+" 词 · 当前 "+ws.length+" 词";
  var tc=document.getElementById("tabs");tc.innerHTML="";
  var ab=mk("button","tab"+(curTab==="all"?" active":""));ab.textContent="全部";ab.onclick=function(){curTab="all";render();};tc.appendChild(ab);
  ls.forEach(function(l){var b=mk("button","tab"+(curTab===l?" active":""));b.textContent="第"+l+"課 ("+words.filter(function(w){return w.tag===l;}).length+")";b.onclick=function(){curTab=l;render();};tc.appendChild(b);});
  var fn=words.filter(function(w){return favs[w.id];}).length;
  var fb=mk("button","tab fav-tab"+(curTab==="fav"?" active":""));fb.textContent="⭐ 收藏 ("+fn+")";fb.onclick=function(){curTab="fav";render();};tc.appendChild(fb);
  if(deleted.length>0){var db=mk("button","tab"+(curTab==="del"?" active":""));db.style.color=curTab==="del"?"#fff":"#c0392b";db.style.borderColor="#c0392b";if(curTab==="del"){db.style.background="#c0392b";}db.textContent="🗑 已删除 ("+deleted.length+")";db.onclick=function(){curTab="del";render();};tc.appendChild(db);}

  var g=document.getElementById("grid");g.innerHTML="";
  if(curTab==="del"){
    deleted.forEach(function(w,di){
      var c=mk("div","word-card deleted");c.dataset.delidx=di;
      c.innerHTML='<div class="row row-kana"><span class="inner">'+esc(w.kana)+'</span></div>'+
        '<div class="row row-kanji '+(w.kanji?"":"empty ")+'"><span class="inner">'+(w.kanji?esc(w.kanji):"—")+'</span></div>'+
        '<div class="row row-meaning"><span class="inner">'+esc(w.meaning)+'</span></div>';
      var pt2=null;
      c.addEventListener("touchstart",function(e){var self=this;pt2=setTimeout(function(){self.classList.remove("pressing");restoreWord(parseInt(self.dataset.delidx));},600);self.classList.add("pressing");});
      c.addEventListener("touchend",function(){clearTimeout(pt2);this.classList.remove("pressing");});
      c.addEventListener("touchmove",function(){clearTimeout(pt2);this.classList.remove("pressing");});
      c.addEventListener("dblclick",function(e){e.preventDefault();restoreWord(parseInt(this.dataset.delidx));});
      g.appendChild(c);
    });
    document.getElementById("emptyMsg").style.display=deleted.length?"none":"block";
    return;
  }
  ws.forEach(function(w){
    var idx=words.indexOf(w);
    var c=mk("div","word-card");c.dataset.idx=idx;
    var kc=hide.kana?"cell-hide":"",jc=hide.kanji?"cell-hide":"",mc=hide.meaning?"cell-hide":"";
    var isF=favs[w.id];
    c.innerHTML='<button class="fav-btn'+(isF?" on":"")+'">★</button>'+
      '<div class="row row-kana '+kc+'"><span class="inner">'+esc(w.kana)+'</span></div>'+
      '<div class="row row-kanji '+(w.kanji?"":"empty ")+jc+'"><span class="inner">'+(w.kanji?esc(w.kanji):"—")+'</span></div>'+
      '<div class="row row-meaning '+mc+'"><span class="inner">'+esc(w.meaning)+'</span></div>';

    // Fav button - no re-render
    c.querySelector(".fav-btn").onclick=function(e){e.stopPropagation();var b=this;
      if(favs[w.id]){delete favs[w.id];b.classList.remove("on");}else{favs[w.id]=true;b.classList.add("on");}
      saveFavs();if(curTab==="fav"){render();}else{updateFavCount();}};

    // Click to reveal hidden cells
    var hs=c.querySelectorAll(".cell-hide");
    for(var i=0;i<hs.length;i++){hs[i].addEventListener("click",function(e){e.stopPropagation();this.classList.toggle("show");});}

    // Long press to edit
    var pt=null;
    c.addEventListener("touchstart",function(e){
      var self=this;pt=setTimeout(function(){self.classList.remove("pressing");openEdit(parseInt(self.dataset.idx));},600);
      self.classList.add("pressing");
    });
    c.addEventListener("touchend",function(){clearTimeout(pt);this.classList.remove("pressing");});
    c.addEventListener("touchmove",function(){clearTimeout(pt);this.classList.remove("pressing");});
    // Desktop: right-click or double-click
    c.addEventListener("dblclick",function(e){e.preventDefault();openEdit(parseInt(this.dataset.idx));});

    g.appendChild(c);
  });

  // Add card button
  var ac=mk("div","add-card");ac.textContent="+";ac.title="添加新单词";
  ac.onclick=function(){openAdd();};
  g.appendChild(ac);

  document.getElementById("emptyMsg").style.display=ws.length?"none":"block";
  ["kana","kanji","meaning"].forEach(function(col){
    var btn=document.getElementById("tog"+col.charAt(0).toUpperCase()+col.slice(1));
    if(hide[col]){btn.classList.add("off");btn.querySelector(".eye").textContent="🙈";}
    else{btn.classList.remove("off");btn.querySelector(".eye").textContent="👁";}
  });
}

function mk(tag,cls){var e=document.createElement(tag);e.className=cls;return e;}
function esc(s){var d=document.createElement("div");d.textContent=s;return d.innerHTML;}

// Modal
function openEdit(idx){
  editIdx=idx;
  var w=words[idx];
  document.getElementById("modalTitle").textContent="编辑单词";
  document.getElementById("mKana").value=w.kana;
  document.getElementById("mKanji").value=w.kanji;
  document.getElementById("mMeaning").value=w.meaning;
  document.getElementById("btnDel").style.display="";
  document.getElementById("btnUp").style.display="";
  document.getElementById("btnDown").style.display="";
  document.getElementById("modal").classList.add("show");
}
function openAdd(){
  editIdx=-1;
  document.getElementById("modalTitle").textContent="添加新单词";
  document.getElementById("mKana").value="";
  document.getElementById("mKanji").value="";
  document.getElementById("mMeaning").value="";
  document.getElementById("btnDel").style.display="none";
  document.getElementById("btnUp").style.display="none";
  document.getElementById("btnDown").style.display="none";
  document.getElementById("modal").classList.add("show");
}
function closeModal(){document.getElementById("modal").classList.remove("show");}

var toastT;
function toast(m){var e=document.getElementById("toast");e.textContent=m;e.classList.add("show");clearTimeout(toastT);toastT=setTimeout(function(){e.classList.remove("show");},1800);}

function restoreWord(di){
  if(di<0||di>=deleted.length)return;
  if(!confirm("撤回删除「"+deleted[di].kana+"」？"))return;
  words.push(deleted[di]);saveWords();
  deleted.splice(di,1);saveDel();
  toast("已撤回");render();
}

document.addEventListener("DOMContentLoaded",function(){
  loadWords();loadFavs();loadDel();render();

  // Toggle columns
  ["Kana","Kanji","Meaning"].forEach(function(col){
    document.getElementById("tog"+col).addEventListener("click",function(){hide[col.toLowerCase()]=!hide[col.toLowerCase()];render();});
  });
  document.getElementById("revealAll").addEventListener("click",function(){hide={kana:false,kanji:false,meaning:false};render();toast("已全部显示");});

  // Modal buttons
  document.getElementById("btnSave").addEventListener("click",function(){
    var k=document.getElementById("mKana").value.trim();
    if(!k){toast("请输入假名");return;}
    var kj=document.getElementById("mKanji").value.trim();
    var mn=document.getElementById("mMeaning").value.trim();
    if(editIdx>=0){
      words[editIdx].kana=k;words[editIdx].kanji=kj;words[editIdx].meaning=mn;
      toast("已保存");
    }else{
      words.push({id:"u"+Date.now(),kana:k,kanji:kj,meaning:mn,tag:curTab!=="all"&&curTab!=="fav"?curTab:"一"});
      toast("已添加："+k);
    }
    saveWords();closeModal();render();
  });
  document.getElementById("btnDel").addEventListener("click",function(){
    if(editIdx<0)return;
    if(!confirm("确定删除「"+words[editIdx].kana+"」？"))return;
    deleted.push(words[editIdx]);saveDel();
    words.splice(editIdx,1);saveWords();closeModal();toast("已移至已删除");render();
  });
  document.getElementById("btnUp").addEventListener("click",function(){
    if(editIdx<=0)return;
    var t=words[editIdx];words[editIdx]=words[editIdx-1];words[editIdx-1]=t;
    editIdx--;saveWords();render();
    openEdit(editIdx);toast("已上移");
  });
  document.getElementById("btnDown").addEventListener("click",function(){
    if(editIdx<0||editIdx>=words.length-1)return;
    var t=words[editIdx];words[editIdx]=words[editIdx+1];words[editIdx+1]=t;
    editIdx++;saveWords();render();
    openEdit(editIdx);toast("已下移");
  });
  document.getElementById("btnCancel").addEventListener("click",closeModal);
  document.getElementById("modal").addEventListener("click",function(e){if(e.target===this)closeModal();});

  // Reset
  document.getElementById("resetBtn").addEventListener("click",function(){
    if(!confirm("确定要重置为初始数据吗？所有编辑和添加的单词将被删除。"))return;
    resetWords();favs={};saveFavs();deleted=[];saveDel();toast("已重置");render();
  });
});
</script>
</body>
</html>

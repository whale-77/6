<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日语综合教程 第六册 · 单词表</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#f6f4f0;--card:#fff;--border:#e0dbd2;--accent:#5b7e6a;--accent-light:#e8f0eb;
  --accent-dark:#3d5c4a;--text:#2c2c2c;--text-light:#888;--kana:#8b5e3c;--kanji:#2c2c2c;
  --meaning:#555;--fav:#d4a853;--fav-light:#fdf6e3;
}
body{font-family:'Noto Sans SC','Noto Sans JP',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
.container{max-width:900px;margin:0 auto;padding:24px 14px 80px}
header{text-align:center;margin-bottom:24px;padding-bottom:16px;border-bottom:2px solid var(--accent)}
header h1{font-size:24px;font-weight:700;color:var(--accent);letter-spacing:3px}
header .sub{font-size:12px;color:var(--text-light);margin-top:6px}

.test-bar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;align-items:center}
.test-label{font-size:12px;color:var(--text-light);white-space:nowrap}
.col-tog{display:flex;align-items:center;gap:5px;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text);transition:.15s;user-select:none}
.col-tog:hover{border-color:var(--accent)}
.col-tog.off{background:var(--accent);color:#fff;border-color:var(--accent)}
.reveal-btn{margin-left:auto;padding:5px 12px;border-radius:7px;border:1px solid var(--border);background:var(--card);font-size:12px;cursor:pointer;font-family:inherit;color:var(--text-light);transition:.15s}
.reveal-btn:hover{border-color:var(--accent);color:var(--accent)}

.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:18px}
.tab{padding:5px 14px;border-radius:18px;border:1px solid var(--border);background:var(--card);font-size:12px;color:var(--text-light);cursor:pointer;font-family:inherit;transition:.15s}
.tab:hover{border-color:var(--accent);color:var(--accent)}
.tab.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.tab.fav-tab{border-color:var(--fav);color:var(--fav)}
.tab.fav-tab.active{background:var(--fav);color:#fff}

.grid{display:flex;flex-wrap:wrap;gap:10px}
.word-card{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px 8px;position:relative;min-width:0;
  flex:0 0 auto;width:calc(20% - 8px);transition:box-shadow .15s;
}
.word-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.06)}
.word-card .row{text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-kana{font-family:'Noto Sans JP',sans-serif;font-size:13px;color:var(--kana);font-weight:500;margin-bottom:2px;letter-spacing:.3px}
.row-kanji{font-family:'Noto Sans JP',sans-serif;font-size:15px;color:var(--kanji);font-weight:700;margin-bottom:3px}
.row-kanji.empty{color:#ccc;font-weight:400}
.row-meaning{font-size:11.5px;color:var(--meaning);line-height:1.4;white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.cell-hide{position:relative;cursor:pointer}
.cell-hide .inner{visibility:hidden}
.cell-hide::after{content:"···";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#f0ede8;color:#bbb;font-size:12px;border-radius:3px}
.cell-hide.show .inner{visibility:visible}
.cell-hide.show::after{display:none}

.fav-btn{position:absolute;top:4px;right:6px;background:none;border:none;font-size:14px;cursor:pointer;opacity:.3;transition:.15s;padding:2px}
.fav-btn:hover{opacity:.7}
.fav-btn.on{opacity:1;color:var(--fav)}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--accent);color:#fff;padding:8px 24px;border-radius:20px;font-size:13px;z-index:99;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.empty-msg{text-align:center;padding:40px;color:var(--text-light);font-size:14px}

@media(max-width:700px){.word-card{width:calc(33.33% - 7px)}}
@media(max-width:480px){.word-card{width:calc(50% - 5px)}.row-kana{font-size:12px}.row-kanji{font-size:13.5px}.row-meaning{font-size:11px}}
</style>
</head>

var SK="jp6_words_v1";var favs={};var curTab="all";var hide={kana:false,kanji:false,meaning:false};

function getLessons(){var s={};DATA.forEach(function(w){s[w[3]]=true;});return Object.keys(s);}
function getWords(){if(curTab==="fav")return DATA.filter(function(w){return favs[w[0]+w[1]];});if(curTab==="all")return DATA;return DATA.filter(function(w){return w[3]===curTab;});}

lessons.forEach(function(l){var b=document.createElement("button");b.className="tab"+(curTab===l?" active":"");b.textContent="第"+l+"課";b.onclick=function(){curTab=l;render();};tc.appendChild(b);});
var favCount=DATA.filter(function(w){return favs[w[0]+w[1]];}).length;
var fb=document.createElement("button");fb.className="tab fav-tab"+(curTab==="fav"?" active":"");fb.textContent="⭐ 收藏 ("+favCount+")";fb.onclick=function(){curTab="fav";render();};tc.appendChild(fb);

words.forEach(function(w){

card.innerHTML='<button class="fav-btn'+(isFav?" on":"")+'">★</button>'+

'<div class="row row-kanji '+(w[1]?"":"empty ")+kac+'"><span class="inner">'+(w[1]?esc(w[1]):"—")+'</span></div>'+
'<div class="row row-meaning '+mc+'"><span class="inner">'+esc(w[2])+'</span></div>';
card.querySelector(".fav-btn").onclick=function(e){e.stopPropagation();var btn=this;if(favs[key]){delete favs[key];btn.classList.remove("on");}else{favs[key]=true;btn.classList.add("on");}save();if(curTab==="fav"){render();}else{updateFavCount();}};
